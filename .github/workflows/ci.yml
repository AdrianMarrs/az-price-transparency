name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The fixtures' lake and warehouse, apart from the default data/ folders.
      LAKE: /tmp/lake
      DUCKDB_PATH: /tmp/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: dbt parse (the Dagster tests read dbt's manifest)
        run: uv run dbt parse --project-dir warehouse --profiles-dir warehouse
      - run: uv run pytest -rs
      - name: dbt build on the test fixtures
        run: |
          uv run python scripts/load_fixtures.py
          uv run python -m ingest.hospitals.compliance
          uv run python -m ingest.hospitals.payer_plans
          uv run dbt build --project-dir warehouse --profiles-dir warehouse

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive infra
      - name: validate (no AWS credentials; backend skipped)
        run: |
          for d in infra/bootstrap infra/main; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # The build reads the live site's data files (serving/export_static.py) to pre-render pages.
      VITE_DATA_URL: https://clearhealthcareprices.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build  # data, type-check, pre-render, move inline scripts out
      - name: build in the container too (docker/web.Dockerfile)
        working-directory: .
        run: docker build -f docker/web.Dockerfile --target site --build-arg VITE_DATA_URL=$VITE_DATA_URL --output type=local,dest=/tmp/site .
