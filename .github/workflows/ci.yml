name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # same image as docker-compose.yml; the loader tests run against it
        image: postgres:16
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt
          POSTGRES_DB: prices
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pt -d prices"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pt:pt@localhost:5432/prices
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: dbt parse (the Dagster tests read dbt's manifest)
        run: uv run dbt parse --project-dir warehouse --profiles-dir warehouse
      - run: uv run pytest -rs
      - name: dbt build on the test fixtures
        run: |
          uv run python scripts/load_fixtures.py
          uv run python -m ingest.hospitals.compliance
          uv run python -m ingest.hospitals.payer_plans
          uv run dbt build --project-dir warehouse --profiles-dir warehouse

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive infra
      - name: validate (no AWS credentials; backend skipped)
        run: |
          for d in infra/bootstrap infra/main; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
