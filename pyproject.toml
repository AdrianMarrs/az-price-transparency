[project]
name = "az-price-transparency"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.43.114",
    "dagster>=1.13.26",
    "dagster-dbt>=0.29.26",
    "dagster-webserver>=1.13.26",
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "ijson>=3.6.0",
    "playwright>=1.64.0",
    "polars>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "dbt-postgres>=1.11.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
