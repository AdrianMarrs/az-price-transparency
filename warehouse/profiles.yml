# The warehouse is a DuckDB file built from the Parquet lake (ingest/lake.py): no server, no
# secrets. Run dbt from the repo root with:
#   uv run dbt build --project-dir warehouse --profiles-dir warehouse
az_prices:
  target: duck
  outputs:
    duck:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'data/warehouse.duckdb') }}"
      schema: analytics
      # One model at a time: DuckDB parallelizes each query itself, and concurrent models
      # on one file raced on table renames ("price_summary__dbt_backup does not exist").
      threads: 1
      extensions: [httpfs, aws, json]
      settings:
        preserve_insertion_order: false  # less memory for large tables
        # DuckDB takes 80% of RAM by default; one model once reached 22 GB on a laptop.
        # Past the limit it spills to disk, next to the database file (<path>.tmp).
        memory_limit: "{{ env_var('DUCKDB_MEMORY', '6GB') }}"
