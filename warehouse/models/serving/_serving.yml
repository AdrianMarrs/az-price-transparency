version: 2

# One row per hospital x service and per hospital, written as static files by
# serving/export_static.py. Built for DynamoDB (400 KB items), whose size bound still keeps
# each hospital's part of a service file small.

models:
  - name: srv_hospital_service_items
    description: One hospital x service item (prices per plan) for the serving table.
    columns:
      - name: item_key
        data_tests: [unique, not_null]
      - name: content_hash
        data_tests: [not_null]
      - name: item_bytes
        data_tests:
          - under_dynamodb_item_limit

  - name: srv_hospital_profiles
    description: One PROFILE item per in-scope hospital, with its compliance score.
    columns:
      - name: item_key
        data_tests: [unique, not_null]
      - name: content_hash
        data_tests: [not_null]
      - name: item_bytes
        data_tests:
          - under_dynamodb_item_limit
