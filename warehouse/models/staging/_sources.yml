version: 2

sources:
  - name: raw
    schema: raw
    description: Tables written by the Python loaders in ingest/hospitals/.
    tables:
      - name: hospital_charges
        description: >
          One row per hospital price for a service code (CPT, HCPCS G, MS-DRG), loaded by
          ingest/hospitals/load.py. Partitioned by state.
      - name: source_files
        description: Every download attempt of a hospital price file (ingest/hospitals/download.py).
      - name: payer_plans
        description: >
          Distinct payer and plan names per hospital across every parsed file
          (ingest/hospitals/payer_plans.py), so payer mapping covers hospitals whose prices
          aren't loaded.
      - name: compliance_checks
        description: >
          One row per hospital x rule from ingest/hospitals/compliance.py. passed is null
          when the rule couldn't be checked (no file to read).
